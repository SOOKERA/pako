<!-- What a tab shows for a moment when the extension caught a download at the server's answer
     (background.js, "catching a download at the server's answer"): the download went to Pako,
     and this page goes straight back to the page you were on. Full extension, Chromium only. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sent to Pako</title>
    <style>
      :root {
        --bg: #0f1114;
        --text-3: #8e95a1;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7f9;
          --text-3: #5b6375;
          color-scheme: light;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
      }
      body {
        display: grid;
        place-items: center;
        font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
        color: var(--text-3);
      }
    </style>
    <script src="lang.js"></script>
    <script src="pako-sent.js"></script>
  </head>
  <body>
    <p id="said" hidden>This download went to Pako.</p>
  </body>
</html>
